<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title> Multi-Factor Authentication </title>

    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configure Tailwind to use a custom primary color (indigo) and the Inter font -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#6366f1', // Indigo-500
                        'primary-dark': '#4f46e5', // Indigo-600
                        'accent': '#10b981', // Emerald-500
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'], // Monospace for the code input
                    },
                }
            }
        }
    </script>
</head>

<body class="bg-gray-900 text-white font-sans min-h-screen flex items-center justify-center p-4">

<!-- MFA Card Container -->
<div class="w-full max-w-md">
    <div class="bg-gray-800 p-8 sm:p-10 rounded-2xl shadow-2xl border border-gray-700 relative overflow-hidden">

        <!-- Decorative Top accent -->
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-accent"></div>

        <div class="text-center mb-8">
            <!-- Shield Icon -->
            <div class="mx-auto w-16 h-16 bg-gray-700/50 rounded-full flex items-center justify-center mb-4 text-primary">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>

            <h1 class="text-2xl font-bold text-white mb-2">Two-Factor Authentication</h1>

            <!-- Dynamic Thymeleaf Message -->
            <p class="text-gray-400 text-sm leading-relaxed">
                Hey <strong class="text-white" th:text="${username}" />,
                please enter the code sent to your email <span class="text-primary font-medium" th:text="${email}" />.
            </p>
        </div>

        <!-- Error Message Area (Thymeleaf conditional) -->
        <div th:if="${error}" class="p-3 mb-6 rounded-lg border border-red-700 bg-red-900/50 text-red-200 text-sm text-center">
            <p th:text="${error}" />
        </div>

        <!-- Form for MFA Submission -->
        <form th:action="@{/mfa-submit}" method="post">

            <!-- Code Input Field (8 letters, wide tracking, uppercase only) -->
            <div class="mb-8">
                <label for="code" class="sr-only">Authentication Code</label>
                <input autocomplete="one-time-code" class="w-full p-4 text-center text-3xl font-mono tracking-[0.5em] uppercase
								rounded-lg bg-gray-900 border-2 border-gray-700 text-white placeholder-gray-600
								focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary
								transition duration-150" id="code"
                       maxlength="8" name="code" oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '')"
                       placeholder="XXXXXXXX"
                       required
                       type="text"/>
                <p class="text-xs text-gray-500 text-center mt-3">
                    Enter the 8-character security code
                </p>
            </div>

            <!-- Verify Button -->
            <button type="submit"
                    class="w-full px-4 py-3 bg-primary hover:bg-primary-dark text-white font-bold
							rounded-lg transition duration-150 shadow-lg shadow-primary/30
							focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-gray-900 flex items-center justify-center">
                Verify Identity
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </form>

        <!-- Footer Links -->
        <div class="mt-8 text-center text-sm text-gray-400">
            Didn't receive the code?
            <a href="#" class="font-medium text-primary hover:text-primary-dark transition duration-150 ml-1">
                Resend Email
            </a>
            <div class="mt-4 border-t border-gray-700 pt-4">
                <a href="/logout" class="text-xs text-gray-500 hover:text-gray-300 transition">
                    Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
