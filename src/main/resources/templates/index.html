<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://thymeleaf.org">
	
	<head>
		<!-- Add viewport meta for responsiveness -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<title> Rohan's page - CourseManager </title>

		<!-- Load Tailwind CSS -->
		<script src="https://cdn.tailwindcss.com"></script>
		<!-- Configure Tailwind to use a custom primary color (indigo) and the Inter font -->
		<script>
			tailwind.config = {
				theme: {
					extend: {
						colors: {
							'primary': '#6366f1', // Indigo-500
							'primary-dark': '#4f46e5', // Indigo-600
							'accent': '#6e83eb', // Emerald-500 for the LLM feature
						},
						fontFamily: {
							sans: ['Inter', 'sans-serif'],
						},
					}
				}
			}
		</script>
	</head>

	<!-- Apply dark background and full-screen layout -->
	<body class="bg-gray-900 text-white font-sans min-h-screen">
		
		<!-- 
			START: Navigation Bar (CourseManager App Link) 
		-->
		<header class="bg-gray-800 shadow-lg sticky top-0 z-10">
			<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
				
				<!-- LEFT SIDE: App Name -->
				<a href="/" class="text-2xl font-extrabold tracking-tight text-primary hover:text-primary-dark transition duration-150">
					CourseManager
				</a>

				<!-- RIGHT SIDE: Contact Us Card/Link -->
				<a href="/contact" class="
					text-accent hover:text-white font-medium transition duration-150 
					flex items-center space-x-2 p-2 rounded-lg 
					hover:bg-gray-700/50
				">
					<!-- Icon for Contact (Mail) -->
					<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
						<path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8m-6 9h6a2 2 0 002-2V7a2 2 0 00-2-2H3a2 2 0 00-2 2v10a2 2 0 002 2h10z" />
					</svg>
					<!-- Text visible on tablet/desktop, hidden on small mobile screens -->
					<span class="hidden sm:inline">Contact Us</span>
				</a>
			</div>
		</header>
		<!-- END: Navigation Bar -->

		<main class="flex flex-col items-center justify-center pt-16 pb-8 px-4">

			<!-- Main Title -->
			 
			
			<p class="text-gray-400 text-xl text-center mb-16 max-w-2xl">
				Select a management area to continue with student enrollment or course administration.
			</p>

			<!-- 
				START: Manage Container (Links converted to modern cards/buttons) 
			-->
			<div class="manage-container grid md:grid-cols-2 gap-8 w-full max-w-4xl mb-16">
				
				<!-- Manage Students Card/Button -->
				<a href="students" class="
					flex flex-col items-center justify-center p-8 md:p-10
					bg-gray-800 border border-gray-700 rounded-2xl 
					shadow-2xl transition duration-300 ease-in-out 
					transform hover:scale-[1.03] hover:shadow-primary-dark/50 
					hover:border-primary-dark focus:outline-none focus:ring-4 focus:ring-primary-dark focus:ring-opacity-50
				">
					<!-- Icon Placeholder (using inline SVG for style) -->
					<svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-4 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
						<path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20h-5v-2a3 3 0 00-5.356-1.857M9 20H4a2 2 0 01-2-2v-6a2 2 0 012-2h12a2 2 0 012 2v6a2 2 0 01-2 2zM7 8l6.364-6.364a1 1 0 011.414 0L22 8" />
					</svg>
					<span class="text-3xl font-bold text-white text-center">
						Manage Students
					</span>
					<span class="mt-2 text-base text-gray-400 text-center">
						View, enroll, and update student records.
					</span>
				</a>
			
				<!-- Manage Courses Card/Button -->
				<a href="courses" class="
					flex flex-col items-center justify-center p-8 md:p-10
					bg-gray-800 border border-gray-700 rounded-2xl 
					shadow-2xl transition duration-300 ease-in-out 
					transform hover:scale-[1.03] hover:shadow-primary-dark/50 
					hover:border-primary-dark focus:outline-none focus:ring-4 focus:ring-primary-dark focus:ring-opacity-50
				">
					<!-- Icon Placeholder (using inline SVG for style) -->
					<svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-4 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
						<path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.42 9.043 5.051 7.257 5c-1.745-.051-3.52 0-5.27 0v13c1.75 0 3.525-.051 5.27 0 1.786.049 3.575.418 4.743 1.157m0-13C13.168 5.42 14.957 5.051 16.743 5c1.745-.051 3.52 0 5.27 0v13c-1.75 0-3.525-.051-5.27 0-1.786.049-3.575.418-4.743 1.157m0-13v13" />
					</svg>
					<span class="text-3xl font-bold text-white text-center">
						Manage Courses
					</span>
					<span class="mt-2 text-base text-gray-400 text-center">
						Create, edit, and organize all academic offerings.
					</span>
				</a>
				
			</div>
			<!-- END: Manage Container -->
	</body>
</html>
