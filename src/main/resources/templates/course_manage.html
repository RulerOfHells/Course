<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://thymeleaf.org" lang="en">
	
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<title> Manage courses </title>
		
		<!-- Load Tailwind CSS -->
		<script src="https://cdn.tailwindcss.com"></script>
		<!-- Configure Tailwind to use the same theme -->
		<script>
			tailwind.config = {
				theme: {
					extend: {
						colors: {
							'primary': '#6366f1', // Indigo-500
							'primary-dark': '#4f46e5', // Indigo-600
							'accent': '#10b981', // Emerald-500
						},
						fontFamily: {
							sans: ['Inter', 'sans-serif'],
						},
					}
				}
			}
		</script>
	</head>

	<body class="bg-gray-900 text-white font-sans min-h-screen">
	
		<!-- Global Message Container (for exceptions/errors) -->
		<div id="globalMessageContainer" class="fixed top-4 right-4 z-50 w-full max-w-sm">
			<!-- Messages will be injected here -->
		</div>

		<!-- Confirmation Modal (for course removal) -->
		<div id="confirmationModal" class="fixed inset-0 bg-black bg-opacity-70 z-40 hidden flex items-center justify-center">
			<div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-red-700/50">
				<h3 class="text-xl font-bold text-red-500 mb-4">Confirm Deletion</h3>
				<p class="text-gray-300 mb-6">Are you sure you want to remove this course? This action cannot be undone.</p>
				<div class="flex justify-end space-x-4">
					<button onclick="closeModal()" class="px-4 py-2 bg-gray-600 hover:bg-gray-500 rounded-lg text-white transition">Cancel</button>
					<a id="confirmDeleteButton" href="#" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg text-white font-semibold transition">Remove Course</a>
				</div>
			</div>
		</div>
		
		<!-- 
			START: Navigation Bar (CourseManager App Link) 
		-->
		<header class="bg-gray-800 shadow-lg sticky top-0 z-10">
			<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center">
				<!-- App Name as Link to Homepage -->
				<a href="/" class="text-2xl font-extrabold tracking-tight text-primary hover:text-primary-dark transition duration-150">
					CourseManager
				</a>
			</div>
		</header>
		<!-- END: Navigation Bar -->

		<main class="py-10 px-4">
			<h1 class="text-4xl font-extrabold text-center mb-10 text-primary"> View/Manage Courses </h1>
			
			<!-- Validation Error Block -->
			<div class="max-w-4xl mx-auto mb-8">
				<div class="p-4 bg-red-900 border border-red-700 rounded-lg shadow-md text-red-300" 
					th:if="${errCourse != null}" th:object="${errCourse}">
					<p th:if="${#fields.hasErrors('courseID')}" th:errors="*{courseID}" class="text-sm font-medium mb-1"/>
					<p th:if="${#fields.hasErrors('courseName')}" th:errors="*{courseName}" class="text-sm font-medium"/>
				</div>
			</div>
			
			<!-- Main Course Table -->
			<div class="max-w-4xl mx-auto overflow-x-auto bg-gray-800 rounded-xl shadow-2xl p-4">
				<table class="w-full text-left main min-w-[500px]">
					<!-- Table Header -->
					<thead class="bg-primary-dark text-gray-100 uppercase text-sm tracking-wider rounded-t-xl">
						<tr>
							<th scope="col" class="py-3 px-6 rounded-tl-xl"> Course ID </th>
							<th scope="col" class="py-3 px-6"> Course Name </th>
							<th scope="col" class="py-3 px-6 rounded-tr-xl"> Actions </th>
						</tr>
					</thead>
					
					<!-- Table Body (Thymeleaf Iteration) -->
					<tbody>
						<tr th:each="course, iterStat : ${courses}" 
							th:classappend="${iterStat.odd} ? 'bg-gray-800' : 'bg-gray-700'"
							class="border-b border-gray-700 hover:bg-gray-600 transition duration-150">
						
							<!-- The form wraps the editable row fields and the update submit button -->
							<form th:action="@{'/courses/update/'+${course.courseID}}" method="post" class="contents">
						
								<td class="py-4 px-6 tdmain font-medium text-gray-300">
									<input type="text" th:id="'id'+${course.courseID}" name="courseID" th:value="${course.courseID}" disabled
										class="w-full bg-transparent text-center disabled:text-gray-400 focus:bg-gray-900 focus:outline-none focus:border-primary-dark focus:ring-1 focus:ring-primary-dark rounded-md p-1"
									/>
								</td>
								<td class="py-4 px-6 tdmain">
									<input type="text" th:id="'name'+${course.courseID}" name="courseName" th:value="${course.courseName}" disabled
										class="w-full bg-transparent text-center disabled:text-gray-400 focus:bg-gray-900 focus:outline-none focus:border-primary-dark focus:ring-1 focus:ring-primary-dark rounded-md p-1"
									/>
								</td>
								
								<!-- Actions Column -->
								<td class="py-4 px-6 flex items-center space-x-3 tdmain">
									<!-- DELETE Icon (opens confirmation modal) -->
									<button type="button" 
										th:attr="onclick=|openModal('@{/courses/remove/}${course.courseID}')|"
										class="p-1 text-red-500 hover:text-red-400 transition duration-150 rounded-full hover:bg-gray-700/50 editX">
										<svg width="20" height="20" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
											<path d="M 10,10 L 30,30 M 30,10 L 10,30" />
										</svg>
									</button>
									
									<!-- EDIT Icon (activates inline editing) -->
									<a th:attr="onclick=|edit(event, '${course.courseID}')|" id="editBtn${course.courseID}" 
										class="p-1 text-green-500 hover:text-green-400 transition duration-150 rounded-full hover:bg-gray-700/50 cursor-pointer editX">
										<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
											<path d="M12 20h9"/>
											<path d="M16.5 3.5l4 4L7.5 19H3v-4L16.5 3.5z"/>
										</svg>
									</a>
									
									<!-- SUBMIT Button (hidden by default) -->
									<button type="submit" th:id="'b'+${course.courseID}" style="display: none"
										class="px-3 py-1 text-sm bg-primary hover:bg-primary-dark text-white rounded-lg transition duration-150 font-semibold shadow-md">
										Save
									</button>
								</td>
							</form>
						</tr>
						
						<!-- Add New Course Row -->
						<tr>
							<td class="py-4 px-6 text-center" colspan="3">
								<button type="button" class="add text-primary hover:text-primary-dark font-bold transition duration-150" onclick="addCourse()"> 
									+ Add new course 
								</button>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

			<!-- Add Course Form (Styled as a Card) -->
			<div class="addForm mt-12 hidden flex justify-center" id="addForm">
				<form th:action="@{'/courses/add'}" method="post" 
					class="w-full max-w-lg p-8 bg-gray-800 border-2 border-primary-dark rounded-xl shadow-2xl space-y-4">
					
					<h3 class="text-2xl font-bold text-accent mb-6 text-center">Add New Course</h3>
					
					<div class="space-y-4">
						<label for="courseID" class="block text-sm font-medium text-gray-400">Course ID</label>
						<input type="text" id="courseID" name="courseID" placeholder="e.g., CS101"
							class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700 text-white focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent" required/>
					</div>
				
					<div class="space-y-4">
						<label for="courseName" class="block text-sm font-medium text-gray-400">Course Name</label>
						<input type="text" id="courseName" name="courseName" placeholder="e.g., Introduction to Programming"
							class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700 text-white focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent" required/>
					</div>
					
					<div class="pt-4">
						<button type="submit" id="submit" 
							class="w-full px-4 py-3 bg-accent hover:bg-emerald-400 text-gray-900 font-bold rounded-lg transition duration-150 shadow-lg">
							Add Course
						</button>
					</div>
				</form>
			</div>
			
			<br class="mb-10" />

			<!-- API Information -->
			<p class="text-gray-500 text-sm text-center mt-16">To use the API, send requests <a href="http://localhost:80/api/courses" class="text-primary hover:text-primary-dark underline">here</a></p>
		</main>
		
		<!-- 
			START: JavaScript for Functionality and Custom UI 
		-->
		<script>
			
			// --- Custom Alert/Modal Functions ---
			
			const globalMessageContainer = document.getElementById('globalMessageContainer');
			const modal = document.getElementById('confirmationModal');
			const confirmDeleteButton = document.getElementById('confirmDeleteButton');

			/**
			 * Displays a transient message (replaces alert()).
			 * @param {string} msg - The message to display.
			 * @param {string} type - 'success', 'error', or 'info'.
			 */
			function showMessage(msg, type = 'info') {
				let bgColor, borderColor, textColor;
				
				switch (type) {
					case 'success':
						bgColor = 'bg-green-800/90';
						borderColor = 'border-green-600';
						textColor = 'text-green-200';
						break;
					case 'error':
						bgColor = 'bg-red-800/90';
						borderColor = 'border-red-600';
						textColor = 'text-red-200';
						break;
					default:
						bgColor = 'bg-blue-800/90';
						borderColor = 'border-blue-600';
						textColor = 'text-blue-200';
				}

				const messageDiv = document.createElement('div');
				messageDiv.className = `p-4 mb-2 rounded-lg shadow-xl border ${bgColor} ${borderColor} ${textColor} transform transition-all duration-300 translate-x-full opacity-0`;
				messageDiv.innerHTML = `<p class="font-medium">${msg}</p>`;

				globalMessageContainer.appendChild(messageDiv);
				
				// Animate in
				setTimeout(() => {
					messageDiv.classList.remove('translate-x-full', 'opacity-0');
					messageDiv.classList.add('translate-x-0', 'opacity-100');
				}, 10);

				// Animate out and remove after 5 seconds
				setTimeout(() => {
					messageDiv.classList.remove('translate-x-0', 'opacity-100');
					messageDiv.classList.add('translate-x-full', 'opacity-0');
					messageDiv.addEventListener('transitionend', () => messageDiv.remove());
				}, 5000);
			}

			/**
			 * Opens the confirmation modal (replaces confirm()).
			 * @param {string} deleteUrl - The URL to navigate to if confirmed.
			 */
			function openModal(deleteUrl) {
				confirmDeleteButton.href = deleteUrl;
				modal.classList.remove('hidden');
			}

			/**
			 * Closes the confirmation modal.
			 */
			function closeModal() {
				modal.classList.add('hidden');
				confirmDeleteButton.href = '#'; // Reset href
			}
			
			// --- Core Course Management Functions ---
			
			function addCourse() {
				document.getElementById('addForm').classList.remove("hidden");
				document.getElementById('addForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
			}
			
			/**
			 * Enables inline editing for a specific course row.
			 * @param {Event} event - The click event.
			 * @param {string} id - The course ID used in element IDs.
			 */
			function edit(event, id) {
				event.preventDefault(); // Stop the <a> tag navigation
				
				// Hide the edit button itself by targeting its ID
				const editButton = document.getElementById('editBtn' + id);
				if (editButton) {
					editButton.style.display = "none";
				} else {
					// Fallback if ID scheme is different, though using ID is best
					const targetElement = event.currentTarget;
					targetElement.style.display = "none";
				}


				let nameInput = document.getElementById('name'+id);
				let idInput = document.getElementById('id'+id);
				let submitButton = document.getElementById('b'+id);
				
				if (nameInput) {
					nameInput.disabled = false;
					nameInput.focus();
					// Add a visual cue to show it's active
					nameInput.classList.remove('disabled:text-gray-400');
					nameInput.classList.add('border', 'border-primary-dark');
				}
				if (idInput) {
					idInput.disabled = false;
					idInput.classList.remove('disabled:text-gray-400');
					idInput.classList.add('border', 'border-primary-dark');
				}
				
				if (submitButton) {
					submitButton.style.display = 'block';
				}
			}
			
			console.log('course executed');
		</script>
		
		<!-- Thymeleaf Exception Message Handler (runs on page load) -->
		<script th:if="${exceptionMsg}">
			let message = "[[${exceptionMsg}]]";
			// Use custom UI instead of native alert
			document.addEventListener('DOMContentLoaded', () => {
				showMessage(message, 'error');
			});
		</script>
		<!-- END: JavaScript -->
	</body>
	
</html>
