<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://thymeleaf.org" lang="en">
	
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<title> Manage students </title>
		
		<!-- Load Tailwind CSS -->
		<script src="https://cdn.tailwindcss.com"></script>
		<!-- Configure Tailwind to use the same theme -->
		<script>
			tailwind.config = {
				theme: {
					extend: {
						colors: {
							'primary': '#6366f1', // Indigo-500
							'primary-dark': '#4f46e5', // Indigo-600
							'accent': '#10b981', // Emerald-500
						},
						fontFamily: {
							sans: ['Inter', 'sans-serif'],
						},
					}
				}
			}
		</script>
		
		<style>
			/* Custom styling for the checkbox area (div with courses) in the table */
			.courses-edit-div {
				display: flex;
				flex-direction: column;
				align-items: flex-start;
				padding-left: 1rem; /* Adjust padding to match text alignment */
			}
			
			.courses-edit-div label {
				display: flex; /* Makes the checkbox and text align nicely */
				align-items: center;
				margin: 0.25rem 0; /* space-y-1 equivalent */
			}

			.courses-edit-div input[type="checkbox"] {
				margin-right: 0.5rem;
				accent-color: var(--tw-colors-accent); /* Use Tailwind accent color */
			}
			
			/* Base styling for all table inputs (default/disabled state) */
			.table-input {
				text-decoration: none;
				color: white;
				padding: 0.25rem; /* p-1 */
				transition: all 0.15s ease-in-out;
				box-shadow: none;
				text-align: left;
				
				/* Default state: fully transparent background and thin transparent border */
				background-color: transparent;
				border: 1px solid transparent; 
			}
			
			/* Styling for disabled state (default view) */
			.table-input:disabled {
				color: #9ca3af; /* gray-400 */
				background-color: transparent;
				border-color: transparent;
			}

			/* Styling applied when 'active-edit' class is added (on focus) */
			.table-input.active-edit {
				background-color: #111827; /* Darker background (gray-900) */
				border: 1px solid #6366f1; /* primary color border */
				color: white;
				border-radius: 0.375rem; /* rounded-md */
			}
		</style>
	</head>
	
	<body class="bg-gray-900 text-white font-sans min-h-screen">
		
		<!-- Global Message Container (for exceptions/errors) -->
		<div id="globalMessageContainer" class="fixed top-4 right-4 z-50 w-full max-w-sm">
			<!-- Messages will be injected here -->
		</div>

		<!-- Confirmation Modal (for student removal) -->
		<div id="confirmationModal" class="fixed inset-0 bg-black bg-opacity-70 z-40 hidden flex items-center justify-center">
			<div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-red-700/50">
				<h3 class="text-xl font-bold text-red-500 mb-4">Confirm Deletion</h3>
				<p class="text-gray-300 mb-6">Are you sure you want to remove this student? This action cannot be undone.</p>
				<div class="flex justify-end space-x-4">
					<button onclick="closeModal()" class="px-4 py-2 bg-gray-600 hover:bg-gray-500 rounded-lg text-white transition">Cancel</button>
					<a id="confirmDeleteButton" href="#" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg text-white font-semibold transition">Remove Student</a>
				</div>
			</div>
		</div>

		<!-- 
			START: Navigation Bar (Student Manager App Link) 
		-->
		<header class="bg-gray-800 shadow-lg sticky top-0 z-10">
			<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center">
				<!-- App Name as Link to Homepage (Placeholder link) -->
				<a href="/" class="text-2xl font-extrabold tracking-tight text-primary hover:text-primary-dark transition duration-150">
					StudentManager
				</a>
			</div>
		</header>
		<!-- END: Navigation Bar -->

		<main class="py-10 px-4">
			<h1 class="text-4xl font-extrabold text-center mb-10 text-primary"> View/Manage Students </h1>
			
			<!-- Validation Error Block -->
			<div class="max-w-5xl mx-auto mb-8">
				<div class="p-4 bg-red-900 border border-red-700 rounded-lg shadow-md text-red-300 text-center" 
					th:if="${errStudent != null}" th:object="${errStudent}">
					<p th:if="${#fields.hasErrors('studentName')}" th:errors="*{studentName}" class="text-sm font-medium mb-1"/>
					<p th:if="${#fields.hasErrors('age')}" th:errors="*{age}" class="text-sm font-medium mb-1"/>
					<p th:if="${#fields.hasErrors('rollNo')}" th:errors="*{rollNo}" class="text-sm font-medium"/>
				</div>
			</div>
		
			<!-- Main Student Table -->
			<div class="max-w-5xl mx-auto overflow-x-auto bg-gray-800 rounded-xl shadow-2xl p-4">
				<table class="w-full text-left min-w-[700px]">
					<!-- Table Header -->
					<thead class="bg-primary-dark text-gray-100 uppercase text-sm tracking-wider rounded-t-xl">
						<tr>
							<th scope="col" class="py-3 px-6 rounded-tl-xl text-left"> Roll No </th>
							<th scope="col" class="py-3 px-6 text-left"> Name </th>
							<th scope="col" class="py-3 px-6 text-left"> Age </th>
							<th scope="col" class="py-3 px-6 text-left"> Assigned Courses </th>
							<th scope="col" class="py-3 px-6 rounded-tr-xl text-center"> Actions </th>
						</tr>
					</thead>
					
					<!-- Table Body (Thymeleaf Iteration) -->
					<tbody>
						<tr th:each="student, iterStat : ${students}" 
							th:classappend="${iterStat.odd} ? 'bg-gray-800' : 'bg-gray-700'"
							class="border-b border-gray-700 hover:bg-gray-600 transition duration-150">

							<form th:action="@{'/students/update/'+${student.rollNo}}" method="post" class="contents">
								
								<!-- Roll No -->
								<td class="py-4 px-10 font-medium text-gray-300 text-left">
									<input type="text" th:id="'roll'+${student.rollNo}" name="rollNo" th:value="${student.rollNo}" disabled
										class="w-full table-input rounded-md"
										onfocus="this.classList.add('active-edit')" 
										onblur="this.classList.remove('active-edit')"/>
								</td>
								
								<!-- Name -->
								<td class="py-4 px-6 text-left">
									<input type="text" th:id="'name'+${student.rollNo}" name="studentName" th:value="${student.studentName}" disabled
										class="w-full table-input rounded-md"
										onfocus="this.classList.add('active-edit')" 
										onblur="this.classList.remove('active-edit')"/>
								</td>
								
								<!-- Age -->
								<td class="py-4 px-6 text-left">
									<input type="text" th:id="'age'+${student.rollNo}" name="age" th:value="${student.age}" disabled
										class="w-full table-input rounded-md"
										onfocus="this.classList.add('active-edit')" 
										onblur="this.classList.remove('active-edit')"/>
								</td>
								
								<!-- Assigned Courses -->
								<td class="py-4 px-6 align-top text-left">
									<!-- Display Mode -->
									<ul th:id="'courses'+${student.rollNo}" class="text-sm space-y-1 text-gray-300 list-disc list-inside">
										<p th:each="id : ${student.courses}">
										<li th:each="course : ${courses.?[courseID == __${id}__]}" th:value="${course.getCourseID()}" th:text="${course.getCourseName()}" />
										</p>
									</ul>
									
									<!-- Edit Mode (Checkboxes) -->
									<div th:id="'div'+${student.rollNo}" style="display:none;" class="courses-edit-div">
										<label th:each="course : ${courses}" class="text-sm font-medium text-gray-300">
											<input type="checkbox" name="courses" th:value="${course.getCourseID()}"
												th:text="${course.getCourseName()}" class="mr-2"/>
										</label>
									</div>
								</td>
								
								<!-- Actions Column -->
								<td class="py-4 px-6 flex items-center justify-center space-x-3 text-center">
									<!-- DELETE Icon (opens confirmation modal) -->
									<button type="button" 
										th:attr="onclick=|openModal('@{/students/remove/}${student.rollNo}')|"
										class="p-1 text-red-500 hover:text-red-400 transition duration-150 rounded-full hover:bg-gray-700/50">
										<svg width="20" height="20" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
											<path d="M 10,10 L 30,30 M 30,10 L 10,30" />
										</svg>
									</button>
									
									<!-- EDIT Icon (activates inline editing) -->
									<a th:attr="onclick=|edit(event, '${student.rollNo}')|" th:id="'editBtn'+${student.rollNo}"
										class="p-1 text-green-500 hover:text-green-400 transition duration-150 rounded-full hover:bg-gray-700/50 cursor-pointer">
										<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
											<path d="M12 20h9"/>
											<path d="M16.5 3.5l4 4L7.5 19H3v-4L16.5 3.5z"/>
										</svg>
									</a>
									
									<!-- SUBMIT Button (hidden by default) -->
									<button type="submit" th:id="'b'+${student.rollNo}" style="display: none"
										class="px-3 py-1 text-sm bg-primary hover:bg-primary-dark text-white rounded-lg transition duration-150 font-semibold shadow-md">
										Save
									</button>
								</td>
							</form>
						</tr>
						
						<!-- Add New Student Row -->
						<tr>
							<td class="py-4 px-6 text-center" colspan="5">
								<button type="button" class="text-primary hover:text-primary-dark font-bold transition duration-150" onclick="addStudent()"> 
									+ Add new student 
								</button>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
			
			<br><br>
			
			<!-- Add Student Form (Styled as a Card) -->
			<div class="addForm mt-12 hidden flex justify-center" id="addForm">
				<form th:action="@{'/students/add'}" method="post" 
					class="w-full max-w-lg p-8 bg-gray-800 border-2 border-primary-dark rounded-xl shadow-2xl space-y-4">
					
					<h3 class="text-2xl font-bold text-accent mb-6 text-center">Add New Student</h3>
					
					<!-- Roll No -->
					<div class="space-y-4">
						<label for="studentRollNo" class="block text-sm font-medium text-gray-400">Enter Roll No</label>
						<input type="text" id="studentRollNo" name="rollNo" placeholder="e.g., 2023001"
							class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700 text-white focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent" required/>
					</div>
					
					<!-- Name -->
					<div class="space-y-4">
						<label for="studentName" class="block text-sm font-medium text-gray-400">Enter Name</label>
						<input type="text" id="studentName" name="studentName" placeholder="e.g., Jane Doe"
							class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700 text-white focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent" required/>
					</div>
					
					<!-- Age -->
					<div class="space-y-4">
						<label for="studentAge" class="block text-sm font-medium text-gray-400">Enter Age</label>
						<input type="text" id="studentAge" name="age" placeholder="e.g., 20"
							class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700 text-white focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent" required/>
					</div>
					
					<!-- Courses -->
					<div class="space-y-4">
						<label for="studentCourses" class="block text-sm font-medium text-gray-400">Select Courses</label>
						<select multiple="multiple" id="studentCourses" name="courses" 
							class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700 text-white focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent" 
							style="height: 150px; color: white">
							<option th:each="course : ${courses}" th:value="${course.getCourseID()}" th:text="${course.getCourseName()}" 
								class="bg-gray-800 hover:bg-gray-700"/>
						</select>
					</div>
					
					<div class="pt-4">
						<button type="submit" id="submit" 
							class="w-full px-4 py-3 bg-accent hover:bg-emerald-400 text-gray-900 font-bold rounded-lg transition duration-150 shadow-lg">
							Add Student
						</button>
					</div>
				</form>
			</div>

			<!-- API Information -->
			<p class="text-gray-500 text-sm text-center mt-16">To use the API, send requests <a href="http://localhost:80/api/students" class="text-primary hover:text-primary-dark underline">here</a></p>
		</main>
		
		<!-- 
			START: JavaScript for Functionality and Custom UI 
		-->
		<script>
			
			// --- Custom Alert/Modal Functions (Reused) ---
			
			const globalMessageContainer = document.getElementById('globalMessageContainer');
			const modal = document.getElementById('confirmationModal');
			const confirmDeleteButton = document.getElementById('confirmDeleteButton');

			/**
			 * Displays a transient message (replaces alert()).
			 * @param {string} msg - The message to display.
			 * @param {string} type - 'success', 'error', or 'info'.
			 */
			function showMessage(msg, type = 'info') {
				let bgColor, borderColor, textColor;
				
				switch (type) {
					case 'success':
						bgColor = 'bg-green-800/90';
						borderColor = 'border-green-600';
						textColor = 'text-green-200';
						break;
					case 'error':
						bgColor = 'bg-red-800/90';
						borderColor = 'border-red-600';
						textColor = 'text-red-200';
						break;
					default:
						bgColor = 'bg-blue-800/90';
						borderColor = 'border-blue-600';
						textColor = 'text-blue-200';
				}

				const messageDiv = document.createElement('div');
				messageDiv.className = `p-4 mb-2 rounded-lg shadow-xl border ${bgColor} ${borderColor} ${textColor} transform transition-all duration-300 translate-x-full opacity-0`;
				messageDiv.innerHTML = `<p class="font-medium">${msg}</p>`;

				globalMessageContainer.appendChild(messageDiv);
				
				// Animate in
				setTimeout(() => {
					messageDiv.classList.remove('translate-x-full', 'opacity-0');
					messageDiv.classList.add('translate-x-0', 'opacity-100');
				}, 10);

				// Animate out and remove after 5 seconds
				setTimeout(() => {
					messageDiv.classList.remove('translate-x-0', 'opacity-100');
					messageDiv.classList.add('translate-x-full', 'opacity-0');
					messageDiv.addEventListener('transitionend', () => messageDiv.remove());
				}, 5000);
			}

			/**
			 * Opens the confirmation modal (replaces confirm()).
			 * @param {string} deleteUrl - The URL to navigate to if confirmed.
			 */
			function openModal(deleteUrl) {
				confirmDeleteButton.href = deleteUrl;
				modal.classList.remove('hidden');
			}

			/**
			 * Closes the confirmation modal.
			 */
			function closeModal() {
				modal.classList.add('hidden');
				confirmDeleteButton.href = '#'; // Reset href
			}
			
			// --- Core Student Management Functions ---

			function addStudent() {
				document.getElementById("addForm").classList.remove('hidden');
				document.getElementById('addForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
			}

			function edit(event, id) {
				event.preventDefault(); // Stop the <a> tag navigation
				
				// Target the edit button container
				const targetElement = document.getElementById('editBtn' + id);
				if (targetElement) {
					targetElement.style.display = "none";
				} else {
					event.currentTarget.style.display = "none";
				}
				

				let fname = document.getElementById('name'+id);
				let froll = document.getElementById('roll'+id);
				let fage = document.getElementById('age'+id);
				let button = document.getElementById('b'+id);
				let ulDisplay = document.getElementById('courses'+id); // The list of assigned courses
				let divCheckboxes = document.getElementById('div'+id); // The hidden div with checkboxes
				
				// 1. Enable inputs
				[fname, froll, fage].forEach(input => {
					if(input) {
						input.disabled = false;
						// The active-edit class is now controlled by the onfocus/onblur handlers on the HTML elements
					}
				});
				
				// 2. Default focus to Student Name (This automatically applies the highlight via the onfocus handler)
				if (fname) fname.focus();
				
				// 3. Toggle visibility
				if(ulDisplay) ulDisplay.style.display = 'none'; // Hide the display list
				if(button) button.style.display = 'block'; // Show the submit button
				
				if(divCheckboxes) {
					divCheckboxes.style.display = 'flex'; // Show the checkboxes
					divCheckboxes.classList.add('courses-edit-div'); // Apply custom styling for vertical layout
					
					// 4. Pre-check checkboxes based on currently assigned courses
					
					// Get IDs from the visible list
					const assignedIds = Array.from(ulDisplay.querySelectorAll('li'))
						.map(li => li.getAttribute('value'));

					// Check the corresponding checkboxes
					Array.from(divCheckboxes.querySelectorAll('input[type="checkbox"]')).forEach(checkbox => {
						if (assignedIds.includes(checkbox.value)) {
							checkbox.checked = true;
						} else {
							checkbox.checked = false;
						}
					});
				}
			}

		</script>
		
		<!-- Thymeleaf Exception Message Handler (runs on page load) -->
		<script th:if="${exceptionMsg}">
			let message = "[[${exceptionMsg}]]";
			// Use custom UI instead of native alert
			document.addEventListener('DOMContentLoaded', () => {
				showMessage(message, 'error');
			});
		</script>
		<!-- END: JavaScript -->
	</body>
</html>
