<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title> Login to your account </title>

    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configure Tailwind to use a custom primary color (indigo) and the Inter font -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#6366f1', // Indigo-500
                        'primary-dark': '#4f46e5', // Indigo-600
                        'accent': '#10b981', // Emerald-500
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>

<body class="bg-gray-900 text-white font-sans min-h-screen flex items-center justify-center p-4">

<!-- Login Card Container -->
<div class="w-full max-w-md">
    <div class="bg-gray-800 p-8 sm:p-10 rounded-2xl shadow-2xl border border-gray-700">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-primary">Welcome Back</h1>
            <p class="text-gray-400 mt-2">Sign in to access your CourseManager account.</p>
        </div>

        <p id="errorMsg" th:if="${error}"
             class="p-4 mb-6 rounded-lg border border-red-700 bg-red-900/50 text-red-300 text-sm font-medium" th:text="${error}"> />

        <form th:action="@{/process-login}" method="post">

            <!-- Email Input Field -->
            <div class="space-y-2 mb-6">
                <label for="email" class="block text-sm font-medium text-gray-300">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required
                       class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700 text-white
								focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent
								transition duration-150"/>
            </div>

            <!-- Password Input Field -->
            <div class="space-y-2 mb-8">
                <label for="password" class="block text-sm font-medium text-gray-300">Password</label>
                <input type="password" id="password" name="password" required
                       class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700 text-white
								focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent
								transition duration-150"/>
            </div>

            <!-- Login Button -->
            <div>
                <button type="submit"
                        class="w-full px-4 py-3 bg-primary hover:bg-primary-dark text-white font-bold
								rounded-lg transition duration-150 shadow-lg shadow-primary/30
								focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-gray-900">
                    Login
                </button>
            </div>
        </form>

        <!-- Footer Links -->
        <div class="mt-6 text-center text-sm">
            <a href="#" class="font-medium text-primary hover:text-primary-dark transition duration-150">
                Forgot Password?
            </a>
        </div>
    </div>

    <div id="loginMessage" class="mt-4 p-4 text-center rounded-lg text-sm hidden"></div>
</div>
</body>
</html>
